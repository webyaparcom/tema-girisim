<header class="modulex-ada{{adasinif}}" role="banner" data-ada-acik="0">
  <div class="modulex-ada-kapsul">
    <a class="modulex-ada-logo" href="/{{lang}}/" aria-label="@home@ - {{web-name}}">
      <img src="/img/{{logo}}" alt="{{web-name}}" loading="eager" decoding="async" />
    </a>
    <nav class="modulex-ada-nav" aria-label="@navigation@">
      <ul>{{adaogeler}}</ul>
    </nav>
    <div class="modulex-ada-uc">
      <div class="modulex-ada-dil">{{langbar}}</div>
      {{adacta}}
      <button class="modulex-ada-ac" type="button" aria-expanded="false" aria-controls="ada-{{id}}-sayfa" aria-label="@menu-toggle@">
        <span class="modulex-ada-ac-cizgi" aria-hidden="true"></span>
        <span class="modulex-ada-ac-cizgi" aria-hidden="true"></span>
      </button>
    </div>
  </div>
  <div class="modulex-ada-perde" hidden></div>
  <div class="modulex-ada-sayfa" id="ada-{{id}}-sayfa" role="dialog" aria-modal="true" aria-label="@menu@" hidden>
    <div class="modulex-ada-tutamac" aria-hidden="true"></div>
    <div class="modulex-ada-sayfa-ust">
      <span class="modulex-ada-sayfa-baslik">@menu@</span>
      <button class="modulex-ada-kapat" type="button" aria-label="@menu-close@">
        <span class="material-symbols-outlined" aria-hidden="true">close</span>
      </button>
    </div>
    <nav class="modulex-ada-sayfa-nav" aria-label="@navigation@">
      <ul>{{adasayfa}}</ul>
    </nav>
    <div class="modulex-ada-sayfa-alt">
      {{adacta}}
      {{langbar}}
    </div>
  </div>
</header>

<style>
  /* menu-ada — yüzen kapsül (15 Kas 2026, G3). Çubuk sayfa kenarına yapışmaz: üstten boşluklu, yuvarlak, cam zeminli «ada».
     Renk çiftleri yalnız desing anahtarından (var(--mx-site-*) varsayılanlı) → koyu mod otomatik.
     Yalnız mantıksal CSS (inline-*), RTL kendiliğinden aynalanır. Mobil: alttan açılan çekmece (≤1024px). */
  .modulex-ada {
    position: relative;
    z-index: 60;
    box-sizing: border-box;
    width: 100%;
    padding-block: --bosluk--;
    padding-inline: 16px;
    color: --text--;
    font-family: var(--mx-font-sans, inherit);
  }
  .modulex-ada *,
  .modulex-ada *::before,
  .modulex-ada *::after { box-sizing: border-box; }
  .modulex-ada--sticky { position: sticky; inset-block-start: 0; }
  /* çekmece açıkken header kendi yığın bağlamında kalır (sticky + z-index) → sayfadaki sabit alt barların üstüne çık */
  .modulex-ada[data-ada-acik="1"] { z-index: 1000; }

  .modulex-ada-kapsul {
    display: flex;
    align-items: center;
    gap: 20px;
    max-width: --max--;
    min-height: 64px;
    margin-inline: auto;
    padding-block: 8px;
    padding-inline: 22px 10px;
    border-radius: --yuvarlak--;
    border: 1px solid --border--;
    background: color-mix(in srgb, --bg-- 82%, transparent);
    -webkit-backdrop-filter: saturate(160%) blur(14px);
    backdrop-filter: saturate(160%) blur(14px);
    box-shadow: 0 10px 30px -18px color-mix(in srgb, --text-- 45%, transparent);
    transition: min-height 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease, padding 0.3s ease;
  }
  .modulex-ada--dolu .modulex-ada-kapsul { background: --bg--; }
  .modulex-ada--cizgi .modulex-ada-kapsul {
    background: transparent;
    border-width: 2px;
    border-color: --text--;
    box-shadow: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  .modulex-ada--kucuk .modulex-ada-kapsul {
    min-height: 52px;
    box-shadow: 0 14px 34px -14px color-mix(in srgb, --text-- 55%, transparent);
  }
  .modulex-ada--cizgi.modulex-ada--kucuk .modulex-ada-kapsul { background: --bg--; }

  .modulex-ada-logo { display: inline-flex; align-items: center; flex-shrink: 0; min-height: 44px; }
  .modulex-ada-logo img {
    display: block;
    height: auto;
    width: auto;
    max-height: --logo_h--;
    max-width: 180px;
    object-fit: contain;
    flex-shrink: 0;
    transition: max-height 0.3s ease;
  }
  .modulex-ada-logo img[src*=".svg"] { height: --logo_h--; width: auto; max-width: none; }
  .modulex-ada--kucuk .modulex-ada-logo img { max-height: calc(--logo_h-- * 0.8); }

  .modulex-ada-nav { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; }
  .modulex-ada-nav ul {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 4px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .modulex-ada .modulex-ada-oge {
    position: relative;
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding-inline: 14px;
    border-radius: 999px;
    color: --text--;
    font-size: 0.95rem;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  .modulex-ada .modulex-ada-oge::after {
    content: "";
    position: absolute;
    inset-inline-start: 50%;
    inset-block-end: 6px;
    width: 5px;
    height: 5px;
    margin-inline-start: -2.5px;
    border-radius: 50%;
    background: --accent--;
    opacity: 0;
    transform: scale(0.2);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .modulex-ada .modulex-ada-oge:hover,
  .modulex-ada .modulex-ada-oge:focus-visible { background: color-mix(in srgb, --text-- 8%, transparent); }
  .modulex-ada .modulex-ada-oge[aria-current="page"]::after,
  .modulex-ada .modulex-ada-oge:hover::after { opacity: 1; transform: scale(1); }
  .modulex-ada .modulex-ada-oge:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

  .modulex-ada-uc { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .modulex-ada-dil { display: flex; align-items: center; color: --text--; }
  .modulex-ada .modulex-ada-cta {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding-inline: 20px;
    border-radius: 999px;
    background: --accent--;
    color: --accentText-- !important;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .modulex-ada .modulex-ada-cta:hover { transform: translateY(-1px); box-shadow: 0 8px 18px -10px --accent--; }
  .modulex-ada .modulex-ada-cta:focus-visible { outline: 2px solid --text--; outline-offset: 2px; }

  .modulex-ada-ac {
    display: none;
    position: relative;
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 50%;
    background: color-mix(in srgb, --text-- 8%, transparent);
    color: --text--;
    cursor: pointer;
    transition: background-color 0.25s ease;
  }
  .modulex-ada-ac:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .modulex-ada-ac-cizgi {
    position: absolute;
    inset-inline-start: 14px;
    width: 20px;
    height: 2px;
    border-radius: 2px;
    background: currentColor;
    transition: transform 0.3s ease;
  }
  .modulex-ada-ac-cizgi:first-child { inset-block-start: 19px; }
  .modulex-ada-ac-cizgi:last-child { inset-block-start: 27px; width: 14px; }

  .modulex-ada-perde {
    position: fixed;
    inset: 0;
    z-index: 70;
    background: color-mix(in srgb, --text-- 40%, transparent);
    animation: modulex-ada-sol 0.3s ease both;
  }
  .modulex-ada-sayfa {
    position: fixed;
    inset-inline: 0;
    inset-block-end: 0;
    z-index: 71;
    max-height: 86vh;
    overflow-y: auto;
    padding: 10px 20px max(28px, env(safe-area-inset-bottom));
    border-radius: 24px 24px 0 0;
    background: --bg--;
    color: --text--;
    box-shadow: 0 -18px 40px -20px color-mix(in srgb, --text-- 60%, transparent);
    animation: modulex-ada-cik 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .modulex-ada-perde[hidden],
  .modulex-ada-sayfa[hidden] { display: none; }
  .modulex-ada-tutamac {
    width: 44px;
    height: 5px;
    margin: 0 auto 12px;
    border-radius: 3px;
    background: color-mix(in srgb, --text-- 25%, transparent);
  }
  .modulex-ada-sayfa-ust { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-block-end: 12px; }
  .modulex-ada-sayfa-baslik { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.7; }
  .modulex-ada-kapat {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 50%;
    background: color-mix(in srgb, --text-- 8%, transparent);
    color: inherit;
    cursor: pointer;
  }
  .modulex-ada-kapat:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .modulex-ada-sayfa-nav ul {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .modulex-ada .modulex-ada-sayfa-oge {
    display: flex;
    align-items: center;
    min-height: 56px;
    padding-inline: 16px;
    border-radius: 16px;
    background: color-mix(in srgb, --text-- 6%, transparent);
    color: --text--;
    font-weight: 600;
    text-decoration: none;
    overflow-wrap: anywhere;
    cursor: pointer;
    transition: background-color 0.25s ease;
  }
  .modulex-ada .modulex-ada-sayfa-oge[aria-current="page"] { background: --accent--; color: --accentText-- !important; }
  .modulex-ada .modulex-ada-sayfa-oge:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .modulex-ada-sayfa-alt { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-block-start: 18px; }

  @keyframes modulex-ada-cik { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes modulex-ada-sol { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 1024px) {
    .modulex-ada-nav,
    .modulex-ada-dil,
    .modulex-ada-uc > .modulex-ada-cta { display: none; }
    .modulex-ada-ac { display: inline-block; }
    .modulex-ada-kapsul { justify-content: space-between; padding-inline: 18px 8px; }
  }
  @media (max-width: 768px) {
    .modulex-ada { padding-inline: 10px; }
    .modulex-ada-kapsul { min-height: 58px; gap: 12px; }
    .modulex-ada-logo img { max-width: 150px; }
  }
  @media (max-width: 380px) {
    .modulex-ada-sayfa-nav ul { grid-template-columns: minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ada *,
    .modulex-ada-kapsul { transition: none !important; animation: none !important; }
  }
</style>

<script>
  (() => {
    const kok = document.querySelector(".modulex-ada");
    if (!kok || kok.dataset.adaHazir) return;
    kok.dataset.adaHazir = "1";
    const dugme = kok.querySelector(".modulex-ada-ac");
    const sayfa = kok.querySelector(".modulex-ada-sayfa");
    const perde = kok.querySelector(".modulex-ada-perde");
    const kapat = kok.querySelector(".modulex-ada-kapat");

    const ac = () => {
      sayfa.hidden = false;
      perde.hidden = false;
      dugme.setAttribute("aria-expanded", "true");
      kok.dataset.adaAcik = "1";
      document.body.style.overflow = "hidden";
      kapat?.focus();
    };
    const kapa = () => {
      if (sayfa.hidden) return;
      sayfa.hidden = true;
      perde.hidden = true;
      dugme.setAttribute("aria-expanded", "false");
      kok.dataset.adaAcik = "0";
      document.body.style.overflow = "";
      dugme.focus();
    };
    kok.addEventListener("click", (e) => {
      if (e.target.closest(".modulex-ada-ac")) { sayfa.hidden ? ac() : kapa(); return; }
      if (e.target.closest(".modulex-ada-kapat") || e.target === perde) { kapa(); return; }
      const a = e.target.closest(".modulex-ada-sayfa a");
      if (a && (a.getAttribute("href") || "").startsWith("#")) kapa();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape" || sayfa.hidden) return;
      kapa();
    });
    /* çekmece içinde Tab döngüsü (odak tuzağı) */
    sayfa.addEventListener("keydown", (e) => {
      if (e.key !== "Tab") return;
      const odak = [...sayfa.querySelectorAll("a[href], button:not([disabled])")].filter((el) => el.offsetParent !== null);
      if (!odak.length) return;
      const ilk = odak[0];
      const son = odak.at(-1);
      if (e.shiftKey && document.activeElement === ilk) { e.preventDefault(); son.focus(); }
      else if (!e.shiftKey && document.activeElement === son) { e.preventDefault(); ilk.focus(); }
    });
    /* masaüstüne dönünce açık çekmeceyi kapat */
    window.matchMedia("(min-width: 1025px)").addEventListener("change", (m) => { if (m.matches) kapa(); });

    if (kok.classList.contains("modulex-ada--sticky")) {
      let bekliyor = false;
      const uygula = () => {
        bekliyor = false;
        kok.classList.toggle("modulex-ada--kucuk", (window.scrollY || 0) > 24);
      };
      window.addEventListener("scroll", () => {
        if (bekliyor) return;
        bekliyor = true;
        requestAnimationFrame(uygula);
      }, { passive: true });
      uygula();
    }
  })();
</script>
